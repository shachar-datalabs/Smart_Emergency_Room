name: smart-emergency-room

services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: smart-er-kafka
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT_HOST://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 24

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    command: >-
      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:29092
      --create --if-not-exists
      --topic ${KAFKA_TOPIC:-patient-events}
      --partitions 1 --replication-factor 1
    restart: "no"

  spark:
    image: apache/spark:3.5.5
    container_name: smart-er-spark
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    command: ["/bin/bash", "-lc", "sleep infinity"]
    environment:
      PYTHONPATH: /opt/smart-er
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: patient-events
      STREAM_OUTPUT_DIR: /opt/smart-er/data/streaming
      WATERMARK_DURATION: 30 minutes
    volumes:
      - ./:/opt/smart-er

volumes: {}
